<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#5b6b7a;stroke-width:1.6;rx:10}
      .title{font-size:17px;font-weight:700;fill:#1f2d3a}
      .sub{font-size:13px;fill:#4a5a68}
      .lane{font-size:13px;fill:#7a8a98;font-weight:600;letter-spacing:1px}
      .arrow{stroke:#5b6b7a;stroke-width:1.8;fill:none;marker-end:url(#arr)}
      .api{fill:#eef6ff;stroke:#2a6fdb}
      .llm{fill:#fff4e8;stroke:#e07a1f}
      .out{fill:#eefaf0;stroke:#2e8b57}
    </style>
  </defs>
  <rect width="1240" height="600" fill="#fafbfc"/>
  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3a">溯源 · 传闻核查链条</text>
  <text x="620" y="58" text-anchor="middle" class="sub">蓝色：元宝搜索 API 参与的步骤 　橙色：大模型参与的步骤 　绿色：最终输出</text>

  <!-- 1 输入 -->
  <rect x="30" y="110" width="170" height="90" class="box"/>
  <text x="115" y="145" text-anchor="middle" class="title">① 粘贴传闻</text>
  <text x="115" y="170" text-anchor="middle" class="sub">群聊/朋友圈/热搜里的</text>
  <text x="115" y="188" text-anchor="middle" class="sub">一段"网传"</text>

  <!-- 2 拆主张 -->
  <rect x="240" y="110" width="190" height="90" class="box llm"/>
  <text x="335" y="145" text-anchor="middle" class="title">② 拆成原子主张</text>
  <text x="335" y="170" text-anchor="middle" class="sub">最多 3 条，每条一件事</text>
  <text x="335" y="188" text-anchor="middle" class="sub">并生成核心/求证/备用检索词</text>

  <!-- 3 多路检索 -->
  <rect x="470" y="90" width="300" height="130" class="box api"/>
  <text x="620" y="118" text-anchor="middle" class="title">③ 五路检索（元宝搜索 SearchPro）</text>
  <text x="620" y="143" text-anchor="middle" class="sub">混合结果 Mode=2 ｜ 新闻站 Industry=news</text>
  <text x="620" y="162" text-anchor="middle" class="sub">政府站 Industry=gov ｜ 求证词 "+辟谣/回应"</text>
  <text x="620" y="181" text-anchor="middle" class="sub">辟谣平台定向 Site=piyao.org.cn / vp.fact.qq.com</text>
  <text x="620" y="204" text-anchor="middle" class="sub" fill="#2a6fdb">每条主张 6 次调用，返回标题/链接/站点/日期/摘要</text>

  <!-- 4 去重分级 -->
  <rect x="810" y="110" width="190" height="90" class="box"/>
  <text x="905" y="145" text-anchor="middle" class="title">④ 去重 + 信源分级</text>
  <text x="905" y="170" text-anchor="middle" class="sub">五档白名单：政府 › 央媒 ›</text>
  <text x="905" y="188" text-anchor="middle" class="sub">主流媒体 › 门户 › 自媒体</text>

  <!-- 5 溯源 -->
  <rect x="1040" y="110" width="170" height="90" class="box api"/>
  <text x="1125" y="145" text-anchor="middle" class="title">⑤ 溯源时间线</text>
  <text x="1125" y="170" text-anchor="middle" class="sub">按日期排序，再向前</text>
  <text x="1125" y="188" text-anchor="middle" class="sub">补搜 30 天 Freshness</text>

  <!-- arrows row 1 -->
  <path d="M200,155 L238,155" class="arrow"/>
  <path d="M430,155 L468,155" class="arrow"/>
  <path d="M770,155 L808,155" class="arrow"/>
  <path d="M1000,155 L1038,155" class="arrow"/>

  <!-- down arrow from 5 to row 2 -->
  <path d="M1125,200 L1125,260 L1125,300" class="arrow"/>

  <!-- 6 原文深读 -->
  <rect x="1000" y="300" width="210" height="90" class="box"/>
  <text x="1105" y="335" text-anchor="middle" class="title">⑥ 原文深读</text>
  <text x="1105" y="360" text-anchor="middle" class="sub">抓取等级最高的 4 篇原文</text>
  <text x="1105" y="378" text-anchor="middle" class="sub">截取含数字/文号的片段</text>

  <!-- 7 判定 -->
  <rect x="640" y="285" width="320" height="120" class="box llm"/>
  <text x="800" y="315" text-anchor="middle" class="title">⑦ 有据判定（大模型 + 9 条硬规则）</text>
  <text x="800" y="340" text-anchor="middle" class="sub">只能依据编号证据，无证据必须"证据不足"</text>
  <text x="800" y="359" text-anchor="middle" class="sub">每句理由带 [编号]；在最早 12 条里挑"传闻首发"</text>
  <text x="800" y="378" text-anchor="middle" class="sub">输出：属实 / 不实 / 部分属实 / 证据不足</text>
  <text x="800" y="397" text-anchor="middle" class="sub">+ 官方口径 + 首发来源说明</text>

  <!-- 8 延伸 -->
  <rect x="400" y="300" width="200" height="90" class="box api"/>
  <text x="500" y="335" text-anchor="middle" class="title">⑧ 延伸话题</text>
  <text x="500" y="360" text-anchor="middle" class="sub">模型给 3 个相关检索词</text>
  <text x="500" y="378" text-anchor="middle" class="sub">各搜一次，附在卡片末尾</text>

  <!-- arrows row 2 (right to left) -->
  <path d="M1000,345 L962,345" class="arrow"/>
  <path d="M640,345 L602,345" class="arrow"/>

  <!-- 9 输出 -->
  <rect x="30" y="270" width="320" height="150" class="box out"/>
  <text x="190" y="300" text-anchor="middle" class="title">⑨ 核查卡</text>
  <text x="190" y="325" text-anchor="middle" class="sub">判定徽章 + 置信度</text>
  <text x="190" y="344" text-anchor="middle" class="sub">结论（每句带出处）· 关键证据 · 官方口径</text>
  <text x="190" y="363" text-anchor="middle" class="sub">首发来源（区分"传闻首发"与"最早背景"）</text>
  <text x="190" y="382" text-anchor="middle" class="sub">完整证据表 · 时间线 · 延伸话题</text>
  <text x="190" y="401" text-anchor="middle" class="sub">本次搜索次数 / 耗时</text>
  <path d="M400,345 L352,345" class="arrow"/>

  <!-- footer -->
  <rect x="30" y="460" width="1180" height="100" rx="10" fill="#f1f4f7" stroke="#d5dce3"/>
  <text x="50" y="488" class="lane">一次核查的开销</text>
  <text x="50" y="514" class="sub">元宝搜索调用 8 ～ 16 次（按主张数）　·　大模型调用 3 次（拆主张 / 判定 / 延伸）　·　耗时约 40 秒　·　搜索结果本地缓存，相同查询不重复扣额度</text>
  <text x="50" y="540" class="sub">技术栈：Python · requests · Streamlit · 任意 OpenAI 兼容大模型（本文用 Kimi）　·　个人版元宝搜索没有权威度字段，信源等级由自建域名白名单给出</text>
</svg>
