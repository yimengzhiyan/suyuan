# 用 nginx 时的站点配置。证书可用 certbot --nginx 申请。
server {
    listen 80;
    server_name suyuan.example.com;
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # Streamlit 走 WebSocket，这两行必须有
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;                    # 一次核查约 40~100 秒
    }
}
