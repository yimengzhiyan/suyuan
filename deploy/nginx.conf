# 用 nginx 时的站点配置。证书可用 certbot --nginx 申请。
server {
    listen 80;
    server_name suyuan.example.com;
    location / {
        proxy_pass http://127.0.0.1:8601;
        proxy_http_version 1.1;
        proxy_buffering off;                        # SSE 实时进度需要关闭缓冲
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;                    # 一次核查约 40~100 秒
    }
}
